<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Money</title>
<meta name="theme-color" content="#0A4D3C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Money">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F1;--card:#fff;--ink:#0F1A16;--mute:#5B6762;--line:#E1E6E2;--soft:#F2F4F1;
  --btn:#0A4D3C;--btn-ink:#fff;--acc:#0A4D3C;--lime:#CDF56B;--hero:#0A4D3C;
  --exp:#B4410C;--inc:#0B7043;--inv:#2B47C9;--warn:#B3261E;
  --exp-bg:#FBE7DC;--inc-bg:#DDF1E6;--inv-bg:#E1E8FB;--warn-bg:#FBE7E4}
@media (prefers-color-scheme:dark){:root{--bg:#0C1210;--card:#151D1A;--ink:#EAF0EC;--mute:#9AA8A1;--line:#25302B;--soft:#0C1210;
  --btn:#CDF56B;--btn-ink:#0C1210;--acc:#7BE0B8;--hero:#12372D;
  --exp:#F29A6B;--inc:#4ADE9A;--inv:#9DB0FF;--warn:#FF8A80;
  --exp-bg:#3A2418;--inc-bg:#12301F;--inv-bg:#1B2347;--warn-bg:#3A1B1A}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.4 Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
svg{flex:none}
main{max-width:720px;margin:0 auto;padding:20px 20px calc(120px + env(safe-area-inset-bottom))}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:0}
h2{font-size:17px;font-weight:800;margin:0}
.sub{color:var(--mute);font-size:13px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{border:0;background:none;color:var(--acc);font-weight:700;font-size:14px;padding:8px}
.btn{height:48px;padding:0 22px;border-radius:24px;border:0;background:var(--btn);color:var(--btn-ink);font-weight:800}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.small{height:40px;padding:0 16px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:10px 12px;font-size:16px;width:100%}
textarea{resize:none}
input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#aitext:focus{outline:none}
.chip{height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.err{color:var(--warn);font-weight:600}
.mute{color:var(--mute)}

/* month bar */
.mbar{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;height:44px}
.mbar button{width:40px;height:44px;border:0;background:none;color:var(--ink);font-size:20px;font-weight:700}
.mbar span{padding:0 6px;font-weight:700;min-width:104px;text-align:center}

/* hero */
.hero{background:var(--hero);color:#fff;border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:14px}
.hero .lbl{font-size:14px;font-weight:600;color:#C3DBD0}
.hero .big{font-size:clamp(38px,12vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1.05}
.hero .big.neg{color:#FFB4A8}
.alloc{display:flex;gap:4px;height:12px}
.alloc i{display:block;border-radius:2px;min-width:0}
.alloc i:first-child{border-radius:6px 2px 2px 6px}.alloc i:last-child{border-radius:2px 6px 6px 2px}
.alloc.empty{background:rgba(255,255,255,.18);border-radius:6px}
.legend{display:flex;justify-content:space-between;gap:8px}
.legend small{display:block;font-size:12px;font-weight:600}
.legend b{font-size:16px;font-weight:700}

/* nudge */
.nudge{display:flex;gap:12px;align-items:flex-start}
.spark{flex:0 0 36px;width:36px;height:36px;border-radius:18px;background:var(--lime);color:#0F1A16;display:flex;align-items:center;justify-content:center}
.nudge p{margin:0 0 4px;font-weight:600;line-height:1.4}

/* budgets */
.bud{display:flex;flex-direction:column;gap:6px}
.bud .t{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.bud .t .mute{white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--exp)}
.bar.over i{background:var(--warn)}.bar.none i{background:var(--mute);opacity:.45}
.bud input{width:96px;padding:4px 8px;text-align:right;border-radius:10px;font-size:14px}

/* rows */
.tile{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.tile.Expense{background:var(--exp-bg);color:var(--exp)}.tile.Income{background:var(--inc-bg);color:var(--inc)}.tile.Investment{background:var(--inv-bg);color:var(--inv)}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;background:var(--card);position:relative;z-index:1;transition:transform .18s ease}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m small{display:block;font-size:12px;color:var(--mute);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:800;white-space:nowrap}.amt.Expense{color:var(--exp)}.amt.Income{color:var(--inc)}.amt.Investment{color:var(--inv)}
.rowwrap{position:relative;overflow:hidden;margin:0 -16px;padding:0 16px;background:var(--card)}
.rowwrap .rmbtn{z-index:0;position:absolute;top:0;bottom:0;right:0;width:88px;border:0;background:var(--warn);color:#fff;font-weight:800;font-size:13px}
.rowwrap.open .row{transform:translateX(-88px)}
.rowwrap .row{margin:0 -16px;padding-left:16px;padding-right:16px}
.day{display:flex;justify-content:space-between;padding:12px 0 4px;font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.4px;text-transform:uppercase;border-top:1px solid var(--line)}
.day:first-child{border-top:0}

.rmx{width:32px;height:32px;border-radius:16px;border:1px solid var(--line);background:var(--soft);color:var(--mute);display:none;align-items:center;justify-content:center;flex:none;padding:0}
@media (hover:hover){.rowwrap:hover .rmx{display:flex}.rowwrap:hover .rmx:hover{color:var(--warn);border-color:var(--warn)}}

.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.search input{border:0;background:none;padding:0;height:46px;border-radius:0}

/* ask */
.bubble{max-width:88%;padding:12px 16px;border-radius:22px;line-height:1.45;font-weight:600}
.bubble.me{align-self:flex-end;background:var(--btn);color:var(--btn-ink);border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble ul{margin:6px 0 0;padding-left:18px}.bubble li{margin:3px 0}
.askbar{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));padding:0 20px;z-index:4}
.askbar>div{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:6px 6px 6px 18px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.askbar input{border:0;background:none;padding:0;height:40px}
.askbar button{width:40px;height:40px;border-radius:20px;border:0;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding:8px 8px calc(8px + env(safe-area-inset-bottom));height:calc(84px + env(safe-area-inset-bottom))}
nav .b{width:64px;height:56px;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700}
nav .b.on{color:var(--acc);font-weight:800}
nav .add{width:60px;height:60px;margin-top:-26px;border-radius:30px;background:var(--btn);color:var(--btn-ink);border:5px solid var(--bg);box-sizing:content-box;display:flex;align-items:center;justify-content:center}
nav .add span,#brand{display:none}
.desk-only{display:none}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto}
.panel{max-width:560px;margin:0 auto;padding:20px 20px 180px;display:flex;flex-direction:column;gap:14px}
.shead{display:flex;justify-content:space-between;align-items:center}
.round{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.sfoot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:14px 20px calc(18px + env(safe-area-inset-bottom));z-index:21}
.sfoot>div{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.sfoot .btn{height:52px;font-size:16px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.drow{display:flex;gap:10px;align-items:center}
.drow .dnote{flex:1;font-weight:800;font-size:17px;border:0;background:none;padding:4px 0}
.drow .damt{width:116px;text-align:right;font-weight:800;font-size:18px}
.segs{display:flex;gap:6px}
.seg{flex:1;height:36px;border-radius:18px;border:1px solid var(--line);background:var(--soft);font-size:13px;font-weight:700;color:var(--mute)}
.seg.on.Expense{background:var(--exp-bg);color:var(--exp);border-color:transparent}
.seg.on.Income{background:var(--inc-bg);color:var(--inc);border-color:transparent}
.seg.on.Investment{background:var(--inv-bg);color:var(--inv);border-color:transparent}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills>*{flex:1 1 120px;min-width:0;height:40px;border-radius:20px;padding:0 12px;font-size:14px;font-weight:700}
.pills .x{flex:0 0 40px;border:1px solid var(--line);background:var(--soft);padding:0}

/* settings */
.catrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.catrow:first-child{border-top:0}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;padding:8px 0 12px}
.picker button{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center}
.picker button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:22px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;gap:14px;align-items:center;max-width:90vw;font-weight:600}
#toast.on{opacity:1;pointer-events:auto}
#toast button{border:0;background:none;color:var(--lime);font-weight:800}
@media (prefers-color-scheme:dark){#toast button{color:#0A4D3C}}

#auth{max-width:380px;margin:12vh auto 0;padding:0 20px}

/* desktop */
.grid2{display:grid;gap:14px}
@media (min-width:900px){
  main{max-width:980px;margin-left:240px;margin-right:auto;padding:32px 40px 60px}
  nav{left:0;right:auto;top:0;bottom:0;width:240px;height:auto;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:6px;padding:28px 18px;border-top:0;border-right:1px solid var(--line)}
  #brand{display:block;font-size:20px;font-weight:800;letter-spacing:-.4px;margin:0 0 18px 10px}
  nav .b{width:auto;height:44px;flex-direction:row;gap:12px;font-size:15px;padding:0 14px;border-radius:14px;justify-content:flex-start}
  nav .b.on{background:var(--soft)}
  nav .add{order:99;margin:auto 0 0;width:auto;height:48px;border:0;border-radius:24px;gap:8px;font-size:15px;font-weight:800;box-sizing:border-box}
  nav .add span{display:inline}
  .grid2{grid-template-columns:1fr 1fr;align-items:start}
  .grid2 .span2{grid-column:1/-1}
  .askbar{left:240px;bottom:24px}
  #toast{bottom:28px}
  .sheet{background:rgba(10,20,16,.45);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .sheet .panel{background:var(--bg);border-radius:28px;width:560px;max-height:88vh;overflow-y:auto;padding-bottom:24px;margin:0}
  .sfoot{position:sticky;margin:0 -20px -24px;border-radius:0 0 28px 28px}
}
</style>
</head>
<body>

<section id="auth" class="hide card stack">
  <div><h1>My Money</h1><p class="sub" style="margin:4px 0 0">Sign in to your tracker.</p></div>
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password (min 6)" autocomplete="current-password">
  <div style="display:flex;gap:8px"><button class="btn" id="signin" style="flex:1">Sign in</button><button class="btn ghost" id="signup" style="flex:1">Create account</button></div>
  <p id="autherr" class="err" style="margin:0"></p>
</section>

<div id="app" class="hide">
<main>

  <!-- HOME -->
  <section id="v-home" class="stack">
    <div class="row-between"><div class="mbar" data-mbar></div><button class="round" id="avatar" aria-label="Account">P</button></div>
    <div id="home-body" class="stack"></div>
  </section>

  <!-- LEDGER -->
  <section id="v-ledger" class="stack hide">
    <div class="row-between"><h1>Ledger</h1><div class="mbar" data-mbar></div></div>
    <label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--mute)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Search notes or categories" aria-label="Search"></label>
    <div class="chips" id="tychips"><button class="chip on" data-ty="">All</button><button class="chip" data-ty="Expense">Expense</button><button class="chip" data-ty="Income">Income</button><button class="chip" data-ty="Investment">Invested</button></div>
    <div class="row-between sub" style="padding:0 4px"><span id="lcount"></span><span id="lsum"></span></div>
    <div class="card" id="llist" style="padding:6px 16px 8px"></div>
  </section>

  <!-- ASK -->
  <section id="v-ask" class="stack hide">
    <div><h1>Ask AI</h1><div class="sub">Answers come from your last 12 months of entries.</div></div>
    <div class="chips" id="askchips"></div>
    <div id="thread" class="stack" style="padding-bottom:80px"></div>
  </section>

  <!-- MORE -->
  <section id="v-more" class="stack hide"></section>

</main>

<div class="askbar hide" id="askbar"><div><input id="askin" placeholder="Ask about your money" aria-label="Ask a question"><button id="asksend" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div></div>

<nav id="nav">
  <div id="brand">My Money</div>
  <button class="b on" data-v="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button class="b" data-v="ledger"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Ledger</button>
  <button class="add" id="addbtn" aria-label="Add transaction"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add entry</span></button>
  <button class="b" data-v="ask"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Ask AI</button>
  <button class="b" data-v="more"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>More</button>
</nav>

<!-- ADD / EDIT SHEET -->
<div id="sheet" class="sheet hide"><div class="panel">
  <div class="shead">
    <button class="round" id="sclose" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2 id="stitle">Add</h2>
    <button class="link" id="smanual">Manual</button>
  </div>
  <div class="card stack" id="composer" style="gap:12px">
    <label for="aitext" class="sub" style="font-weight:700">Say it like you would text it</label>
    <textarea id="aitext" style="border:0;background:none;padding:0;font-size:19px;font-weight:700;line-height:1.35;height:96px" placeholder="450 dinner at Vaikuntam yesterday, 1200 auto + toll on credit card"></textarea>
    <div style="display:flex;gap:8px;align-items:center">
      <label class="btn ghost small" style="display:flex;align-items:center;gap:8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Receipt<input id="img" type="file" accept="image/*" class="hide"></label>
      <div style="flex:1"></div>
      <button class="btn small" id="parse" style="display:flex;align-items:center;gap:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Read it</button>
    </div>
  </div>
  <p id="parsemsg" class="sub" style="margin:0"></p>
  <div class="row-between hide" id="dhead"><h2 id="dcount"></h2><span class="sub">Tap anything to fix it</span></div>
  <div id="drafts" class="stack"></div>
  <div class="sfoot"><div><button class="btn" id="saveall">Save</button><button class="link" id="clear">Discard</button></div></div>
</div></div>

<div id="toast"></div>
</div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inr = (n) => "₹" + Math.round(Math.abs(Number(n) || 0)).toLocaleString("en-IN");
const sb = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);
const TYPES = ["Expense", "Income", "Investment"];
const TYPE_LABEL = { Expense: "Expense", Income: "Income", Investment: "Invested" };
const S = { uid: null, cats: [], accts: [], tx: [], budgets: {}, month: "", view: "home", q: "", ty: "", draft: [], editId: null, chat: [], editBud: false, pick: null, deferred: null };
const pad = (n) => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dateOf = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const shiftMonth = (m, k) => { const [y, mo] = m.split("-").map(Number); const d = new Date(y, mo - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const monthLabel = (m) => dateOf(m + "-01").toLocaleDateString("en-IN", { month: "short", year: "numeric" });
S.month = todayStr().slice(0, 7);

let toastTimer;
function toast(msg, label, fn) {
  const t = $("toast"); t.innerHTML = `<span>${esc(msg)}</span>${label ? `<button>${esc(label)}</button>` : ""}`;
  if (label) t.querySelector("button").onclick = () => { t.classList.remove("on"); fn(); };
  t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), label ? 5000 : 2400);
}

const KEYWORDS = [[/coffee|cafe|tea/i, "coffee"], [/din|food|restaur|eat|swiggy|zomato|lunch|snack/i, "food"], [/flight|trip|travel|hotel/i, "plane"], [/transport|fuel|petrol|diesel|auto|cab|uber|ola|metro|parking|toll/i, "car"], [/grocer|vegetable|milk|supermarket|kirana/i, "basket"], [/shop|cloth|apparel|amazon|fashion/i, "bag"], [/health|doctor|medic|pharm|hospital|dental|gym/i, "heart"], [/util|electric|water|gas|bill|internet|wifi|recharge|broadband/i, "bolt"], [/entertain|movie|netflix|music|game|subscription/i, "film"], [/personal|care|salon|groom/i, "sparkle"], [/work|office|business/i, "brief"], [/rent|home|house|maintenance/i, "home"], [/salary|freelance|income|interest|dividend|bonus/i, "cash"], [/insur/i, "shield"], [/small ?case|coin|zeb|kite|zerodha|stock|mutual|sip|crypto|invest|fund/i, "trend"], [/gift|donat|charity/i, "gift"], [/educat|course|book|school|fees/i, "book"], [/phone|mobile/i, "phone"]];
function iconKey(name, type) {
  const c = S.cats.find((k) => k.name === name);
  if (c && c.icon && ICONS[c.icon]) return c.icon;
  for (const [re, k] of KEYWORDS) if (re.test(name)) return k;
  return type === "Income" ? "cash" : type === "Investment" ? "trend" : "tag";
}

async function authDo(kind) {

  const { error } = kind === "in" ? await sb.auth.signInWithPassword(creds) : await sb.auth.signUp(creds);

async function start(session) {

  $("auth").classList.add("hide"); $("app").classList.remove("hide");

async function loadAll() {
  const [c, a, t, b] = await Promise.all([
    sb.from("categories").select("*").order("name"),
    sb.from("accounts").select("name").order("name"),
    fetchAllTx(),
    sb.from("budgets").select("category,monthly_amount"),
  ]);
  S.cats = c.data || []; S.accts = (a.data || []).map((x) => x.name); S.tx = t;
  S.budgets = Object.fromEntries((b.data || []).map((x) => [x.category, Number(x.monthly_amount)]));

async function fetchAllTx() {
  let all = [], from = 0;
  for (;;) {
    const { data, error } = await sb.from("transactions").select("*").order("date", { ascending: false }).order("created_at", { ascending: false }).range(from, from + 999);
    if (error) { toast(error.message); break; }
    all = all.concat(data); if (data.length < 1000) break; from += 1000;
  }
  return all;
}
const sortTx = () => S.tx.sort((a, b) => (b.date + (b.created_at || "")).localeCompare(a.date + (a.created_at || "")));

/* ---------- home ---------- */
const monthRows = (m) => S.tx.filter((t) => t.date.startsWith(m));
const sum = (rows, ty) => rows.filter((t) => t.type === ty).reduce((a, t) => a + Number(t.amount), 0);

function nudge(m, rows) {
  const prev = [1, 2, 3].map((k) => shiftMonth(m, -k));
  const now = {}, hist = {};
  rows.filter((t) => t.type === "Expense").forEach((t) => now[t.category] = (now[t.category] || 0) + Number(t.amount));
  prev.forEach((pm) => monthRows(pm).filter((t) => t.type === "Expense").forEach((t) => hist[t.category] = (hist[t.category] || 0) + Number(t.amount) / 3));
  let best = null;
  for (const c in now) {
    const avg = hist[c] || 0;
    if (avg > 0 && now[c] > avg * 1.25 && now[c] - avg >= 1000 && (!best || now[c] - avg > best.d)) best = { c, d: now[c] - avg, pct: Math.round((now[c] / avg - 1) * 100) };
  }
  return best
    ? { text: `${best.c} is ${best.pct}% above your 3-month average (${inr(best.d)} more).`, q: `Why is my ${best.c} spending higher than usual in ${monthLabel(m)}?`, cta: "Ask why" }
    : { text: rows.length ? "Nothing unusual against your recent months." : "No entries this month yet.", q: `Give me a review of ${monthLabel(m)} compared with my usual months.`, cta: "Get a review" };
}

function renderHome() {
  const m = S.month, rows = monthRows(m);
  const inc = sum(rows, "Income"), exp = sum(rows, "Expense"), inv = sum(rows, "Investment"), left = inc - exp - inv;
  const base = Math.max(inc, exp + inv);
  const pct = (v) => base ? (v / base) * 100 : 0;
  const isNow = m === todayStr().slice(0, 7);
  let days = "";
  if (isNow) { const d = new Date(); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); days = ` ${last - d.getDate()} days to go.`; }
  const rate = inc ? Math.round(((inc - exp) / inc) * 100) + "% saved before investing" : "";
  const n = nudge(m, rows);

  const byCat = {}; rows.filter((t) => t.type === "Expense").forEach((t) => byCat[t.category] = (byCat[t.category] || 0) + Number(t.amount));
  const expCats = S.cats.filter((c) => c.type === "Expense").map((c) => c.name);
  let names = [...new Set([...Object.keys(byCat), ...Object.keys(S.budgets).filter((k) => expCats.includes(k) || byCat[k])])];
  names.sort((a, b) => (byCat[b] || 0) - (byCat[a] || 0));
  if (S.editBud) names = expCats.slice().sort((a, b) => (byCat[b] || 0) - (byCat[a] || 0));
  else names = names.slice(0, 6);
  const mx = Math.max(1, ...names.map((k) => byCat[k] || 0));
  const bud = names.map((k) => {
    const v = byCat[k] || 0, b = S.budgets[k] || 0, over = b && v > b;
    const w = Math.min(100, (v / (b || mx)) * 100);
    const right = S.editBud ? `<input type="number" inputmode="numeric" data-bud="${esc(k)}" value="${b || ""}" placeholder="Budget" aria-label="Budget for ${esc(k)}">` : `<span class="mute">${inr(v)}${b ? " / " + inr(b) : ""}</span>`;
    return `<div class="bud"><div class="t"><span>${esc(k)}${over ? ` <b style="color:var(--warn)">· over by ${inr(v - b)}</b>` : ""}</span>${right}</div><div class="bar ${over ? "over" : b ? "" : "none"}"><i style="width:${w}%"></i></div></div>`;
  }).join("") || `<p class="sub" style="margin:0">No expenses this month.</p>`;

  const recent = S.tx.slice(0, 5).map((t) => rowInner(t)).map((h) => `<div class="row" style="margin:0">${h}</div>`).join("") || `<p class="sub" style="margin:0">No entries yet. Import your Sheet in More.</p>`;

  $("home-body").innerHTML = `
  <div class="grid2">
    <div class="hero">
      <div><div class="lbl">${left < 0 ? "Over by" : "Left this month"}</div><div class="big ${left < 0 ? "neg" : ""}">${inr(left)}</div>
      <div class="lbl" style="font-size:13px;font-weight:500">Income minus spending and investing.${days}${rate ? " " + rate + "." : ""}</div></div>
      ${base ? `<div class="alloc"><i style="flex:${pct(exp)};background:#F4A27A"></i><i style="flex:${pct(inv)};background:#9DB0FF"></i><i style="flex:${Math.max(0, pct(left))};background:#CDF56B"></i></div>` : `<div class="alloc empty"></div>`}
      <div class="legend"><div><small style="color:#F4A27A">Spent</small><b>${inr(exp)}</b></div><div><small style="color:#9DB0FF">Invested</small><b>${inr(inv)}</b></div><div style="text-align:right"><small style="color:#C3DBD0">Income</small><b>${inr(inc)}</b></div></div>
    </div>
    <div class="card nudge"><div class="spark">${svg(ICONS.sparkle, 20, 2)}</div><div><p>${esc(n.text)}</p><button class="link" style="padding:0" data-ask="${esc(n.q)}">${esc(n.cta)} →</button></div></div>
  </div>
  <div class="grid2">
    <div class="card stack" style="gap:12px"><div class="row-between"><h2>Budgets</h2><button class="link" id="budedit" style="padding:0">${S.editBud ? "Done" : "Edit"}</button></div>${bud}</div>
    <div class="card stack" style="gap:2px"><div class="row-between" style="margin-bottom:6px"><h2>Recent</h2><button class="link" style="padding:0" data-v-go="ledger">See all</button></div>${recent}</div>
  </div>`;
}
$("home-body").addEventListener("click", (e) => {
  if (e.target.id === "budedit") { S.editBud = !S.editBud; renderHome(); }
  const a = e.target.closest("[data-ask]"); if (a) { go("ask"); ask(a.dataset.ask); }
  const g = e.target.closest("[data-v-go]"); if (g) go(g.dataset.vGo);

$("home-body").addEventListener("change", async (e) => {

  const { error } = v > 0 ? await sb.from("budgets").upsert({ user_id: S.uid, category: c, monthly_amount: v }) : await sb.from("budgets").delete().eq("category", c);

/* ---------- rows ---------- */
function rowInner(t) {
  const sign = t.type === "Income" ? "+" : "−";
  return `${tile(t.category, t.type)}<div class="m"><b>${esc(t.note || t.category)}</b><small>${esc(t.category)} · ${esc(t.account)}</small></div><span class="amt ${t.type}">${sign}${inr(t.amount)}</span>`;
}
function dayLabel(s) {
  const t = todayStr(); if (s === t) return "Today";
  const y = dateOf(t); y.setDate(y.getDate() - 1); if (s === `${y.getFullYear()}-${pad(y.getMonth() + 1)}-${pad(y.getDate())}`) return "Yesterday";
  return dateOf(s).toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
}

/* ---------- ledger ---------- */
function renderLedger() {
  const q = S.q.toLowerCase();
  const rows = S.tx.filter((t) => t.date.startsWith(S.month) && (!S.ty || t.type === S.ty) && (!q || (t.note + " " + t.category + " " + t.account).toLowerCase().includes(q)));
  $("lcount").textContent = `${rows.length} ${rows.length === 1 ? "entry" : "entries"}`;
  $("lsum").textContent = `Spent ${inr(sum(rows, "Expense"))} · Invested ${inr(sum(rows, "Investment"))}`;
  document.querySelectorAll("#tychips .chip").forEach((c) => c.classList.toggle("on", c.dataset.ty === S.ty));
  let html = "", day = "";
  for (const t of rows) {
    if (t.date !== day) {
      day = t.date;
      const net = rows.filter((x) => x.date === day).reduce((a, x) => a + (x.type === "Income" ? 1 : -1) * Number(x.amount), 0);
      html += `<div class="day"><span>${esc(dayLabel(day))}</span><span>${net < 0 ? "−" : "+"}${inr(net)}</span></div>`;
    }
    html += `<div class="rowwrap" data-id="${t.id}"><div class="row">${rowInner(t)}<button class="rmx" data-rm="${t.id}" aria-label="Delete entry">✕</button></div><button class="rmbtn" data-rm="${t.id}">Delete</button></div>`;
  }
  $("llist").innerHTML = html || `<p class="sub" style="margin:14px 0">Nothing here.</p>`;
}
$("q").oninput = (e) => { S.q = e.target.value; renderLedger(); };
$("tychips").onclick = (e) => { if (e.target.dataset.ty !== undefined) { S.ty = e.target.dataset.ty; renderLedger(); } };

let sw = null, lastSwipe = 0;
const llist = $("llist");
llist.addEventListener("touchstart", (e) => {
  const w = e.target.closest(".rowwrap"); if (!w) return;
  llist.querySelectorAll(".rowwrap.open").forEach((o) => { if (o !== w) o.classList.remove("open"); });
  sw = { w, x: e.touches[0].clientX, y: e.touches[0].clientY, open: w.classList.contains("open"), dx: 0 };
}, { passive: true });
llist.addEventListener("touchmove", (e) => {
  if (!sw) return;
  const dx = e.touches[0].clientX - sw.x, dy = e.touches[0].clientY - sw.y;
  if (Math.abs(dy) > Math.abs(dx) && Math.abs(dx) < 10) { sw = null; return; }
  sw.dx = dx;
  const row = sw.w.firstElementChild; row.style.transition = "none";
  row.style.transform = `translateX(${Math.min(0, Math.max(-88, (sw.open ? -88 : 0) + dx))}px)`;
}, { passive: true });
llist.addEventListener("touchend", () => {
  if (!sw) return;
  const row = sw.w.firstElementChild; row.style.transition = ""; row.style.transform = "";
  const moved = Math.abs(sw.dx) > 8;
  if (moved) { lastSwipe = Date.now(); sw.w.classList.toggle("open", (sw.open ? -88 : 0) + sw.dx < -44); }
  sw = null;
});
llist.addEventListener("click", (e) => {
  if (Date.now() - lastSwipe < 350) return;
  const rm = e.target.closest("[data-rm]"); if (rm) return removeTx(rm.dataset.rm);
  const w = e.target.closest(".rowwrap"); if (!w) return;
  if (w.classList.contains("open")) return w.classList.remove("open");
  openSheet(w.dataset.id);
});
async function removeTx(id) {
  const t = S.tx.find((x) => x.id === id); if (!t) return;
  S.tx = S.tx.filter((x) => x.id !== id); renderAll();
  const { error } = await sb.from("transactions").delete().eq("id", id);
  if (error) { S.tx.push(t); sortTx(); renderAll(); return toast(error.message); }
  toast("Entry deleted", "Undo", async () => {
    const { error: e2 } = await sb.from("transactions").insert(t);
    if (e2) return toast(e2.message);
    S.tx.push(t); sortTx(); renderAll(); toast("Restored");
  });
}

const blankRow = () => ({ date: todayStr(), type: "Expense", account: S.accts[0] || "", category: catsOf("Expense")[0] || "", note: "", amount: "" });
function openSheet(editId) {
  S.editId = editId || null; $("parsemsg").textContent = "";

$("addbtn").onclick = () => openSheet();
$("sclose").onclick = closeSheet;
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeSheet(); });

const opts = (list, sel) => list.map((v) => `<option ${v === sel ? "selected" : ""}>${esc(v)}</option>`).join("");
function renderDraft() {
  $("dhead").classList.toggle("hide", !S.draft.length || !!S.editId);

    <div class="segs">${TYPES.map((t) => `<button class="seg ${r.type === t ? "on " + t : ""}" data-type="${t}">${TYPE_LABEL[t]}</button>`).join("")}</div>
    <div class="pills"><input type="date" data-f="date" value="${esc(r.date)}" aria-label="Date"><select data-f="category" aria-label="Category">${opts(catsOf(r.type), r.category)}</select><select data-f="account" aria-label="Account">${opts(S.accts, r.account)}</select>${S.editId ? "" : `<button class="x" data-del aria-label="Remove">✕</button>`}</div>
  </div>`).join("");
  updateFoot();

function updateFoot() {
  const n = S.draft.length, total = S.draft.reduce((a, r) => a + (Number(r.amount) || 0), 0);

  $("clear").classList.toggle("hide", !S.editId && !n);
}
$("drafts").addEventListener("input", (e) => {
  const f = e.target.dataset.f; if (!f) return;
  S.draft[e.target.closest("[data-i]").dataset.i][f] = e.target.value; updateFoot();
});
$("drafts").addEventListener("click", (e) => {
  const card = e.target.closest("[data-i]"); if (!card) return; const i = Number(card.dataset.i);
  if (e.target.dataset.type) {
    const r = S.draft[i]; r.type = e.target.dataset.type;
    if (!catsOf(r.type).includes(r.category)) r.category = catsOf(r.type)[0] || "";
    renderDraft();
  }
  if (e.target.closest("[data-del]")) { S.draft.splice(i, 1); renderDraft(); }
});

async function callAI(payload) {
  const { data, error } = await sb.functions.invoke("ai", { body: payload });
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch (_) {} throw new Error(m); }
  if (data?.error) throw new Error(data.error);
  return data;
}
async function runParse(image) {
  const text = $("aitext").value.trim();
  if (!text && !image) return ($("parsemsg").textContent = "Type something or add a receipt photo.");
  $("parse").disabled = true; $("parsemsg").textContent = "Reading…";
  try {
    const r = await callAI({ action: "parse", text, image, categories: S.cats.map((c) => ({ name: c.name, type: c.type })), accounts: S.accts });
    const rows = (r.transactions || []).map((t) => {
      const type = TYPES.includes(t.type) ? t.type : "Expense";
      return { date: /^\d{4}-\d{2}-\d{2}$/.test(t.date) ? t.date : todayStr(), type, account: S.accts.includes(t.account) ? t.account : S.accts[0], category: catsOf(type).includes(t.category) ? t.category : catsOf(type)[0] || "", note: t.note || "", amount: t.amount };
    });
    S.draft.push(...rows); renderDraft();
    $("parsemsg").textContent = rows.length ? "" : "I couldn't find a transaction in that.";
    $("aitext").value = "";
  } catch (e) { $("parsemsg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  $("parse").disabled = false;
}
$("parse").onclick = () => runParse(null);
$("img").onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    const data = cv.toDataURL("image/jpeg", 0.82).split(",")[1];
    e.target.value = ""; runParse({ media_type: "image/jpeg", data });
  } catch (_) { $("parsemsg").innerHTML = '<span class="err">Could not read that image.</span>'; }
};
$("saveall").onclick = async () => {
  const rows = S.draft.map((r) => ({ date: r.date, type: r.type, account: r.account, category: r.category, note: (r.note || "").trim(), amount: Number(r.amount) }));
  if (rows.some((r) => !r.date || !r.category || !r.account || !(r.amount >= 0) || isNaN(r.amount) || r.amount === 0)) return toast("Fill date, category and a non-zero amount");
  $("saveall").disabled = true;
  if (S.editId) {
    const { data, error } = await sb.from("transactions").update(rows[0]).eq("id", S.editId).select().single();
    if (error) { $("saveall").disabled = false; return toast(error.message); }
    S.tx = S.tx.map((t) => t.id === S.editId ? data : t);
  } else {
    const { data, error } = await sb.from("transactions").insert(rows).select();
    if (error) { $("saveall").disabled = false; return toast(error.message); }
    S.tx.push(...data);
  }
  sortTx(); closeSheet(); renderAll(); toast("Saved");
};

/* ---------- ask ---------- */
const QUICK = ["Review this month vs my usual", "Where am I overspending?", "What are my recurring costs?", "How much did I invest in the last 6 months?", "Which big one-offs stand out?", "Suggest a realistic monthly budget"];
$("askchips").innerHTML = QUICK.map((q) => `<button class="chip">${esc(q)}</button>`).join("");
$("askchips").onclick = (e) => { if (e.target.classList.contains("chip")) ask(e.target.textContent); };
function md(s) {
  const lines = esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split("\n");
  let out = "", inList = false;
  for (const l of lines) {
    const li = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${li[1]}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    const h = l.match(/^#{1,4}\s+(.*)/);
    out += h ? `<div><b>${h[1]}</b></div>` : l.trim() ? `<div>${l}</div>` : "";
  }
  return out + (inList ? "</ul>" : "");
}
function renderAsk() {
  $("thread").innerHTML = S.chat.map((m) => m.role === "me" ? `<div class="bubble me">${esc(m.text)}</div>` : `<div class="bubble ai">${m.loading ? '<span class="mute">Thinking…</span>' : m.err ? `<span class="err">${esc(m.text)}</span>` : md(m.text)}</div>`).join("");
  window.scrollTo(0, document.body.scrollHeight);
}
async function ask(q) {
  q = (q || "").trim(); if (!q) return;
  S.chat.push({ role: "me", text: q }); const a = { role: "ai", loading: true, text: "" }; S.chat.push(a); $("askin").value = ""; renderAsk();
  try { a.text = (await callAI({ action: "ask", question: q })).answer; } catch (e) { a.err = true; a.text = e.message; }
  a.loading = false; renderAsk();
}
$("asksend").onclick = () => ask($("askin").value);
$("askin").onkeydown = (e) => { if (e.key === "Enter") ask($("askin").value); };

/* ---------- more ---------- */
function renderMore() {
  const cats = S.cats.slice().sort((a, b) => TYPES.indexOf(a.type) - TYPES.indexOf(b.type) || a.name.localeCompare(b.name));
  $("v-more").innerHTML = `
  <h1>More</h1>
  ${S.deferred ? `<div class="card row-between"><div><b>Install My Money</b><div class="sub">Opens like an app, works offline.</div></div><button class="btn small" id="install">Install</button></div>` : `<div class="card sub">To install: Android Chrome menu → Install app. iPhone Safari → Share → Add to Home Screen.</div>`}
  <div class="card stack"><h2>Import from your Google Sheet</h2><p class="sub" style="margin:0">In the Sheet open Transactions, then File → Download → CSV. Columns used: Date, Type, Account, Category, Note, Amount. Import a file once only.</p><input type="file" id="csv" accept=".csv,text/csv"><p id="impmsg" style="margin:0"></p></div>
  <div class="card stack"><h2>Categories and icons</h2><p class="sub" style="margin:0">Tap a category to change its icon.</p>
    <div>${cats.map((c) => `<button class="catrow" data-cat="${esc(c.name)}">${tile(c.name, c.type)}<div style="flex:1"><b>${esc(c.name)}</b><div class="sub">${esc(TYPE_LABEL[c.type])}</div></div></button>${S.pick === c.name ? `<div class="picker">${Object.keys(ICONS).map((k) => `<button data-icon="${k}" class="${iconKey(c.name, c.type) === k ? "on" : ""}" aria-label="${k}">${svg(ICONS[k])}</button>`).join("")}</div>` : ""}`).join("")}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="newcat" placeholder="New category" style="flex:2 1 160px"><select id="newcattype" style="flex:1 1 110px">${TYPES.map((t) => `<option>${t}</option>`).join("")}</select><button class="btn small" id="addcat">Add</button></div>
  </div>
  <div class="card stack"><h2>Accounts</h2><div class="sub">${S.accts.map(esc).join(" · ")}</div><div style="display:flex;gap:8px"><input id="newacc" placeholder="New account"><button class="btn small" id="addacc">Add</button></div></div>
  <div class="card stack"><h2>Your data</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost small" id="export">Download all as CSV</button><button class="btn ghost small" id="signout">Sign out</button></div></div>`;
}
$("v-more").addEventListener("click", async (e) => {
  const t = e.target;
  if (t.id === "install" && S.deferred) { S.deferred.prompt(); S.deferred = null; renderMore(); }
  const row = t.closest("[data-cat]"); if (row) { S.pick = S.pick === row.dataset.cat ? null : row.dataset.cat; renderMore(); return; }
  const ic = t.closest("[data-icon]");
  if (ic && S.pick) {
    const { error } = await sb.from("categories").update({ icon: ic.dataset.icon }).eq("name", S.pick);
    if (error) return toast("Run migration_icons.sql in Supabase first");
    const c = S.cats.find((k) => k.name === S.pick); if (c) c.icon = ic.dataset.icon; S.pick = null; renderMore(); toast("Icon updated");
  }
  if (t.id === "addcat") { const n = $("newcat").value.trim(); if (!n) return; const { error } = await sb.from("categories").insert({ name: n, type: $("newcattype").value }); if (error) return toast(error.message); await loadAll(); renderMore(); toast("Category added"); }
  if (t.id === "addacc") { const n = $("newacc").value.trim(); if (!n) return; const { error } = await sb.from("accounts").insert({ name: n }); if (error) return toast(error.message); await loadAll(); renderMore(); toast("Account added"); }
  if (t.id === "export") {
    const q = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
    const csv = "Date,Type,Account,Category,Note,Amount\n" + S.tx.map((x) => [x.date, x.type, x.account, x.category, x.note, x.amount].map(q).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "transactions.csv"; a.click();
  }
  if (t.id === "signout") signOut();
});
$("v-more").addEventListener("change", (e) => { if (e.target.id === "csv") importCSV(e.target); });
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); S.deferred = e; if (S.view === "more") renderMore(); });

function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); f = ""; rows.push(row); row = []; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim()));
}
function isoDate(s) {
  s = s.trim(); let m;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return `${m[3]}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[0];
  return null;
}
async function importCSV(input) {
  const file = input.files[0]; if (!file) return;
  const msg = $("impmsg"), rows = parseCSV(await file.text()); const head = (rows.shift() || []).map((h) => h.trim().toLowerCase());
  const ix = (n) => head.indexOf(n);
  if (["date", "type", "category", "amount"].some((n) => ix(n) < 0)) return (msg.innerHTML = '<span class="err">Header row needs Date, Type, Account, Category, Note, Amount.</span>');
  const out = [], bad = [];
  for (const r of rows) {
    const d = isoDate(r[ix("date")] || ""), amt = Number(String(r[ix("amount")] || "").replace(/[₹,\s]/g, ""));
    const type = (r[ix("type")] || "").trim(), cat = (r[ix("category")] || "").trim();
    if (!d || !TYPES.includes(type) || !cat || isNaN(amt)) { bad.push(r.join(",")); continue; }
    out.push({ date: d, type, account: (r[ix("account")] || "").trim() || S.accts[0], category: cat, note: (r[ix("note")] || "").trim(), amount: amt });
  }
  if (!confirm(`Import ${out.length} transactions${bad.length ? ` (${bad.length} unreadable rows skipped)` : ""}? Importing the same file twice creates duplicates.`)) { input.value = ""; return; }
  for (const c of [...new Set(out.map((r) => r.category + "|" + r.type))].map((x) => x.split("|"))) if (!S.cats.some((k) => k.name === c[0])) await sb.from("categories").insert({ name: c[0], type: c[1] });
  for (const a of new Set(out.map((r) => r.account))) if (!S.accts.includes(a)) await sb.from("accounts").insert({ name: a });
  for (let i = 0; i < out.length; i += 200) {
    const { error } = await sb.from("transactions").insert(out.slice(i, i + 200));
    if (error) return (msg.innerHTML = `<span class="err">${esc(error.message)}</span>`);
  }
  input.value = ""; await loadAll(); renderMore(); $("impmsg").textContent = `Imported ${out.length} rows.`;
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("sheet").classList.contains("hide")) closeSheet(); });
boot();
