name: Supabase keep-alive
# Free Supabase projects pause after ~7 days of inactivity. This pings the API twice a week.
on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "https://lmjsbmbbzenyoyzmejun.supabase.co/rest/v1/categories?select=id&limit=1" \
            -H "apikey: sb_publishable_wIM8kLlKKYhR-L2mfETK1A_nuof2qE3" > /dev/null
